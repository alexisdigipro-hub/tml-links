<style>html,body{margin:0;height:100%;background:#0f1115;color:#e9ecf1;font:15px/1.4 system-ui,sans-serif}body{display:grid;place-items:center}a{color:#7ab8ff}</style>
<script>
  // go.themadlions.com/s/Ab3dEf9hJk2L opens the app at #/s/Ab3dEf9hJk2L (the same for /sl/, /n/, /d/, /e/, /inv/, /pr/, /ps/)
  var APP = 'https://hub.themadlions.com/';
  // links made from 13 Oct are go.themadlions.com/?s/Ab3dEf9hJk2L: the address is this very page, so a
  // chat gets it with 200 and shows the logo (a /s/... address only exists as 404.html, answered 404,
  // and chats skip 404 pages); the older /s/... links keep working through 404.html
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  var q = location.search.slice(1);
  var to = path ? APP + '#/' + path + location.search : /^[a-z]+\//.test(q) ? APP + '#/' + q : APP + (location.hash || '');
  location.replace(to);
</script>
</head>
<body>
<p>Opening… <a id="go" href="https://hub.themadlions.com/">tap here</a> if nothing happens.</p>
<script>document.getElementById('go').href = to</script>
</body>
